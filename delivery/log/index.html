<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>🛡️ Vibe Analytics V9</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Noto+Sans+JP:wght@400;500;700;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #08090d; --surface: #0f1117; --surface2: #161820;
      --border: rgba(255,255,255,0.08); --border2: rgba(255,255,255,0.14);
      --text: #f0f0f0; --muted: rgba(255,255,255,0.38); --muted2: rgba(255,255,255,0.55);
      --accent: #ff5c1a; --accent2: #e91e8c; --green: #00e676; --yellow: #ffd600;
      --blue: #2979ff; --teal: #00bcd4;
      --font-head: 'Bebas Neue', sans-serif;
      --font-body: 'Noto Sans JP', sans-serif;
      --font-mono: 'Space Mono', monospace;
      --radius: 14px; --radius-sm: 9px;
    }
    html, body { height: 100%; background: var(--bg); color: var(--text); font-family: var(--font-body); overflow-x: hidden; }
    
    /* APP LAYOUT (デリザルト風シェル) */
    .app-shell { display: flex; height: 100vh; width: 100vw; overflow: hidden; }
    .main-content { flex: 1; display: flex; flex-direction: column; overflow-y: auto; padding-bottom: 100px; }
    
    /* SIDEBAR (PC用) / NAV TABS (スマホ用) */
    .sidebar {
      width: 260px; background: var(--surface); border-right: 1px solid var(--border);
      display: flex; flex-direction: column; padding: 20px; gap: 20px;
    }
    .brand { display: flex; align-items: center; gap: 12px; padding-bottom: 15px; border-bottom: 1px solid var(--border); }
    .brand-mark { font-size: 24px; }
    .brand-title { font-family: var(--font-head); font-size: 22px; letter-spacing: 0.05em; color: #fff; }
    
    .nav-menu { display: flex; flex-direction: column; gap: 8px; }
    .nav-item {
      display: flex; align-items: center; gap: 12px; padding: 12px 16px;
      background: transparent; border: none; border-radius: var(--radius-sm);
      color: var(--muted2); font-size: 15px; font-weight: 500; text-align: left; cursor: pointer; transition: all 0.2s;
    }
    .nav-item:hover { background: rgba(255,255,255,0.03); color: #fff; }
    .nav-item.active { background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #fff; font-weight: 700; }
    .nav-icon { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; }

    /* HEADER TOPBAR */
    .topbar {
      background: rgba(8,9,13,0.85); backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border); padding: 16px 24px;
      display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100;
    }
    .topbar h1 { font-size: 20px; font-weight: 900; letter-spacing: -0.02em; }
    .topbar p { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; }

    /* SUMMARY BAR */
    .summary-bar {
      background: var(--surface); border-bottom: 1px solid var(--border);
      padding: 14px 24px; display: flex; flex-direction: column; gap: 10px;
    }
    .sum-row { display: flex; gap: 0; overflow-x: auto; }
    .sum-row::-webkit-scrollbar { display: none; }
    .sum-item { flex-shrink: 0; padding: 0 20px 0 0; border-right: 1px solid var(--border); margin-right: 20px; }
    .sum-item:last-child { border-right: none; margin-right: 0; }
    .sum-label { font-size: 10px; color: var(--muted); margin-bottom: 3px; }
    .sum-val { font-size: 20px; font-family: var(--font-mono); font-weight: 700; }
    .sum-val.accent { color: var(--accent); }
    .sum-val.green { color: var(--green); }
    .sum-val.yellow { color: var(--yellow); }
    .sum-val.teal { color: var(--teal); }
    .sum-row + .sum-row { border-top: 1px solid var(--border); padding-top: 10px; }

    .goal-bar {
      background: var(--surface); border-bottom: 1px solid var(--border);
      padding: 10px 24px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    }
    .goal-label { font-size: 12px; color: var(--muted); white-space: nowrap; }
    .goal-input {
      font-family: var(--font-mono); font-size: 14px; font-weight: 700;
      background: var(--bg); border: 1px solid var(--border); border-radius: 6px;
      color: var(--text); padding: 4px 8px; width: 110px; text-align: right;
    }
    .goal-stat { font-size: 13px; font-family: var(--font-mono); font-weight: 700; }
    .goal-stat.remain { color: var(--accent); }
    .goal-stat.done { color: var(--green); }
    .goal-stat.cnt { color: var(--yellow); }

    /* VIEW MANAGEMENT */
    .view-container { padding: 24px; max-width: 700px; width: 100%; margin: 0 auto; display: none; }
    .view-container.active { display: block; }
    .section-title { font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 12px; }

    /* CARDS & FORMS */
    .card { background: var(--surface); border: 1.5px solid var(--border); border-radius: var(--radius); padding: 18px; margin-bottom: 16px; }
    .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    label { font-size: 12px; color: var(--muted); display: block; margin-bottom: 6px; font-weight: 500; }
    input, select, textarea {
      width: 100%; padding: 11px 12px; background: rgba(255,255,255,0.04);
      border: 1.5px solid var(--border); border-radius: var(--radius-sm); color: #fff; font-size: 14px; font-family: var(--font-body);
    }
    input:focus, select:focus, textarea:focus { border-color: var(--accent); outline: none; }

    /* SET CARDS */
    .set-card { background: rgba(255,255,255,0.02); border: 1.5px solid var(--border); border-radius: var(--radius); margin-bottom: 14px; overflow: hidden; }
    .set-header { padding: 14px 18px; display: flex; align-items: center; justify-content: space-between; cursor: pointer; user-select: none; }
    .set-header:hover { background: rgba(255,255,255,0.02); }
    .set-title { font-weight: 900; font-size: 14px; display: flex; align-items: center; gap: 8px; }
    .set-badge { font-size: 10px; padding: 2px 7px; border-radius: 4px; font-weight: 700; }
    .set-badge.active { background: rgba(255,92,26,0.2); color: var(--accent); }
    .set-badge.done { background: rgba(0,230,118,0.15); color: var(--green); }
    .set-summary { font-size: 12px; color: var(--muted2); font-family: var(--font-mono); }
    .set-body { padding: 0 18px 18px; border-top: 1px solid var(--border); }
    
    .time-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding-top: 14px; margin-bottom: 12px; }
    .time-field { display: flex; gap: 6px; }
    .stamp-btn { padding: 0 12px; background: var(--accent); color: #fff; border-radius: 6px; font-size: 11px; font-weight: 900; border: none; cursor: pointer; min-height: 42px; }
    .stamp-btn.secondary { background: rgba(255,255,255,0.15); }
    .time-duration { font-size: 11px; color: var(--teal); font-family: var(--font-mono); margin-top: 4px; }

    .platform-block { border-radius: 11px; padding: 14px; margin-bottom: 12px; border: 1px solid var(--border); }
    .platform-title { font-size: 13px; font-weight: 900; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
    .diff-badge { font-size: 11px; padding: 2px 7px; border-radius: 4px; background: rgba(0,230,118,0.15); color: var(--green); font-family: var(--font-mono); }
    .pf-inputs { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }

    /* CORE BUTTONS */
    .add-btn { width: 100%; padding: 16px; background: rgba(255,255,255,0.03); border: 2px dashed var(--border); color: var(--muted2); font-weight: bold; border-radius: var(--radius); cursor: pointer; font-size: 14px; }
    .add-btn:hover { background: rgba(255,255,255,0.05); color: #fff; }
    .gen-btn { width: 100%; padding: 16px; background: linear-gradient(135deg, var(--accent), var(--accent2)); border-radius: var(--radius); color: #fff; font-size: 16px; font-weight: 900; border: none; cursor: pointer; }
    .del-btn { width: 100%; padding: 8px; background: rgba(255,60,60,0.06); color: rgba(255,100,100,0.7); border: 1px solid rgba(255,60,60,0.15); border-radius: 7px; font-size: 12px; cursor: pointer; margin-top: 8px; }
    .reset-btn { width: 100%; padding: 12px; background: rgba(255,60,60,0.08); color: #ff6e6e; border: 1px solid rgba(255,60,60,0.2); border-radius: 10px; font-size: 13px; cursor: pointer; margin-top: 16px; }

    .log-box { background: #000; border: 1px solid var(--border); border-radius: var(--radius); margin-top: 14px; padding: 16px; font-family: var(--font-mono); font-size: 12px; white-space: pre-wrap; line-height: 1.7; color: #ccc; }
    .copy-btn { width: 100%; margin-top: 10px; padding: 12px; background: var(--green); color: #000; font-weight: bold; border-radius: 8px; border: none; cursor: pointer; font-size: 14px; }
    .chevron { font-size: 12px; color: var(--muted); transition: transform 0.2s; }
    .chevron.open { transform: rotate(180deg); }

    /* HISTORY LIST CARD */
    .history-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 18px; margin-bottom: 10px; cursor: pointer; display: flex; align-items: center; justify-content: space-between; }
    .history-card:hover { background: var(--surface2); border-color: var(--muted); }
    .history-date { font-weight: 700; font-size: 15px; }
    .history-summary { font-family: var(--font-mono); font-size: 14px; color: var(--muted2); }

    /* CALENDAR GRID VIEW */
    .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin-top: 10px; }
    .cal-head-cell { text-align: center; font-size: 11px; color: var(--muted); font-weight: 700; padding: 6px 0; }
    .cal-day-cell { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; min-height: 75px; padding: 6px; cursor: pointer; display: flex; flex-direction: column; justify-content: space-between; }
    .cal-day-cell:hover { background: var(--surface2); border-color: var(--muted2); }
    .cal-day-cell.empty { background: transparent; border: none; cursor: default; }
    .cal-day-cell.selected { border-color: var(--accent); background: rgba(255,92,26,0.05); }
    .cal-day-num { font-size: 12px; font-weight: 700; font-family: var(--font-mono); color: var(--muted2); }
    .cal-day-num.current-month { color: #fff; }
    .cal-day-amt { font-size: 11px; font-family: var(--font-mono); font-weight: 700; text-align: right; color: var(--accent); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    /* BOTTOM NAV TABS (MOBILE ONLY) */
    .bottom-nav {
      position: fixed; bottom: 0; left: 0; right: 0; height: 68px;
      background: rgba(15,17,23,0.92); backdrop-filter: blur(20px);
      border-top: 1px solid var(--border); display: none; justify-content: space-around; align-items: center; z-index: 500;
    }
    .tab-btn {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: transparent; border: none; color: var(--muted); gap: 4px; font-size: 10px; font-weight: 500; cursor: pointer; width: 60px;
    }
    .tab-btn.active { color: var(--accent); font-weight: 700; }

    /* RESPONSIVE LAYOUT */
    @media (max-width: 768px) {
      .sidebar { display: none; }
      .bottom-nav { display: flex; }
      .topbar { padding: 14px 16px; }
      .view-container { padding: 16px; }
      .summary-bar { padding: 12px 16px; }
      .goal-bar { padding: 10px 16px; }
    }
  </style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useMemo, useEffect, useCallback } = React;

const SK = {
  db: 'delivery_log_vault_v9',
  currentDate: 'delivery_log_current_date_v9',
};

const PLATFORMS = [
  { key: 'd', label: '出前館', color: '#ff5c1a' },
  { key: 'u', label: 'Uber Eats',   color: '#06C167' },
  { key: 'r', label: 'RocketNow', color: '#2979ff' },
  { key: 'm', label: 'menu',   color: '#e91e8c' },
];

const WEATHERS = ['晴','曇','雨','雪','晴→雨','雨→晴','曇→雨'];

function getNow() {
  const d = new Date();
  return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
}

function getBusinessDateStr() {
  const d = new Date();
  if (d.getHours() < 4) { d.setDate(d.getDate() - 1); }
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

function calcDuration(start, end) {
  if (!start || !end) return null;
  const [sh,sm] = start.split(':').map(Number);
  let [eh,em] = end.split(':').map(Number);
  let mins = (eh * 60 + em) - (sh * 60 + sm);
  if (mins < 0) mins += 24 * 60;
  return { h: Math.floor(mins / 60), m: mins % 60, total: mins / 60 };
}

const EMPTY_SET = () => ({
  start: '', end: '',
  d_cum: '', u_cum: '', r_cum: '', m_cum: '',
  d_cnt_cum: '', u_cnt_cum: '', r_cnt_cum: '', m_cnt_cum: '',
  d_que_cum: '', u_que_cum: '', r_que_cum: '', m_que_cum: '',
  km_cum: '', memo: '', open: true,
});

function loadInitialVault() {
  try { const raw = localStorage.getItem(SK.db); return raw ? JSON.parse(raw) : {}; } catch { return {}; }
}
function loadInitialDate() { return localStorage.getItem(SK.currentDate) || getBusinessDateStr(); }

/* ────────────────── MAIN APP ────────────────── */
function App() {
  const [vault, setVault] = useState(loadInitialVault);
  const [date, setDate] = useState(loadInitialDate);
  const [activeTab, setActiveTab] = useState('dashboard'); // 'dashboard', 'calendar', 'entries', 'settings'
  const [showLog, setShowLog] = useState(false);

  const dayData = useMemo(() => {
    return vault[date] || { weather: '晴', goalAmt: 0, sets: [EMPTY_SET()] };
  }, [vault, date]);

  const { weather, goalAmt, sets } = dayData;

  useEffect(() => { localStorage.setItem(SK.db, JSON.stringify(vault)); }, [vault]);
  useEffect(() => { localStorage.setItem(SK.currentDate, date); setShowLog(false); }, [date]);

  const updateDayField = useCallback((field, value) => {
    setVault(prev => ({
      ...prev,
      [date]: {
        weather: prev[date]?.weather || '晴',
        goalAmt: prev[date]?.goalAmt || 0,
        sets: prev[date]?.sets || [EMPTY_SET()],
        ...prev[date],
        [field]: value
      }
    }));
  }, [date]);

  const calced = useMemo(() => {
    const n = v => parseFloat(v) || 0;
    return sets.map((s, i) => {
      const p = sets[i-1] || {
        d_cum:0, u_cum:0, r_cum:0, m_cum:0,
        d_cnt_cum:0, u_cnt_cum:0, r_cnt_cum:0, m_cnt_cum:0,
        d_que_cum:0, u_que_cum:0, r_que_cum:0, m_que_cum:0,
        km_cum:0,
      };
      return {
        ...s,
        d_p: n(s.d_cum)-n(p.d_cum), u_p: n(s.u_cum)-n(p.u_cum), r_p: n(s.r_cum)-n(p.r_cum), m_p: n(s.m_cum)-n(p.m_cum),
        d_c: n(s.d_cnt_cum)-n(p.d_cnt_cum), u_c: n(s.u_cnt_cum)-n(p.u_cnt_cum), r_c: n(s.r_cnt_cum)-n(p.r_cnt_cum), m_c: n(s.m_cnt_cum)-n(p.m_cnt_cum),
        d_qp: n(s.d_que_cum)-n(p.d_que_cum), u_qp: n(s.u_que_cum)-n(p.u_que_cum), r_qp: n(s.r_que_cum)-n(p.r_que_cum), m_qp: n(s.m_que_cum)-n(p.m_que_cum),
        km_p: n(s.km_cum)-n(p.km_cum), dur: calcDuration(s.start, s.end),
      };
    });
  }, [sets]);

  const summary = useMemo(() => {
    const n = v => parseFloat(v) || 0;
    const last = sets[sets.length - 1] || EMPTY_SET();
    const total_sales = n(last.d_cum) + n(last.u_cum) + n(last.r_cum) + n(last.m_cum);
    const total_que   = n(last.d_que_cum) + n(last.u_que_cum) + n(last.r_que_cum) + n(last.m_que_cum);
    const total_cnt   = n(last.d_cnt_cum) + n(last.u_cnt_cum) + n(last.r_cnt_cum) + n(last.m_cnt_cum);
    const total_km    = n(last.km_cum);
    const total_h     = calced.reduce((a, s) => a + (s.dur ? s.dur.total : 0), 0);
    return {
      total_sales, total_que, real_sales: total_sales, total_cnt, total_km, total_h,
      jikyu: total_h > 0 ? Math.round((total_sales + total_que) / total_h) : 0
    };
  }, [sets, calced]);

  const updateSet = useCallback((i, key, val) => {
    const newSets = [...sets]; newSets[i] = { ...newSets[i], [key]: val };
    updateDayField('sets', newSets);
  }, [sets, updateDayField]);

  const toggleOpen = (i) => {
    const newSets = [...sets]; newSets[i] = { ...newSets[i], open: !newSets[i].open };
    updateDayField('sets', newSets);
  };

  const addSet = () => {
    const last = sets[sets.length - 1] || EMPTY_SET();
    updateDayField('sets', [...sets, {
      ...EMPTY_SET(),
      d_cum: last.d_cum, u_cum: last.u_cum, r_cum: last.r_cum, m_cum: last.m_cum,
      d_cnt_cum: last.d_cnt_cum, u_cnt_cum: last.u_cnt_cum, r_cnt_cum: last.r_cnt_cum, m_cnt_cum: last.m_cnt_cum,
      d_que_cum: last.d_que_cum, u_que_cum: last.u_que_cum, r_que_cum: last.r_que_cum, m_que_cum: last.m_que_cum,
      km_cum: last.km_cum,
    }]);
  };

  const deleteSet = (i) => {
    if (sets.length <= 1) return;
    if (!window.confirm(`SET ${i+1} を削除しますか？`)) return;
    updateDayField('sets', sets.filter((_, idx) => idx !== i));
  };

  const startNewDay = () => {
    const targetDate = getBusinessDateStr();
    if (date === targetDate) {
      if (!window.confirm('現在の最新営業日データを完全にクリアしてリセットしますか？')) return;
      setVault(prev => ({ ...prev, [targetDate]: { weather: '晴', goalAmt: 0, sets: [EMPTY_SET()] } }));
    } else { setDate(targetDate); }
  };

  const historyList = useMemo(() => {
    const n = v => parseFloat(v) || 0;
    return Object.keys(vault).sort().reverse().map(dKey => {
      const day = vault[dKey]; const sList = day.sets || []; const lastS = sList[sList.length - 1] || {};
      return {
        dateKey: dKey,
        total: (n(lastS.d_cum) + n(lastS.u_cum) + n(lastS.r_cum) + n(lastS.m_cum)) + (n(lastS.d_que_cum) + n(lastS.u_que_cum) + n(lastS.r_que_cum) + n(lastS.m_que_cum)),
        count: n(lastS.d_cnt_cum) + n(lastS.u_cnt_cum) + n(lastS.r_cnt_cum) + n(lastS.m_cnt_cum)
      };
    });
  }, [vault]);

  // カレンダー画面描画用
  const calendarDays = useMemo(() => {
    const [year, month] = date.split('-').map(Number);
    const firstDayIndex = new Date(year, month - 1, 1).getDay();
    const totalDays = new Date(year, month, 0).getDate();
    const cells = [];
    for (let i = 0; i < firstDayIndex; i++) { cells.push({ empty: true }); }
    for (let dayNum = 1; dayNum <= totalDays; dayNum++) {
      const currentKey = `${year}-${String(month).padStart(2,'0')}-${String(dayNum).padStart(2,'0')}`;
      const dayVault = vault[currentKey];
      let totalSales = 0;
      if (dayVault && dayVault.sets && dayVault.sets.length > 0) {
        const n = v => parseFloat(v) || 0; const lastS = dayVault.sets[dayVault.sets.length - 1];
        totalSales = (n(lastS.d_cum) + n(lastS.u_cum) + n(lastS.r_cum) + n(lastS.m_cum)) + (n(lastS.d_que_cum) + n(lastS.u_que_cum) + n(lastS.r_que_cum) + n(lastS.m_que_cum));
      }
      cells.push({ empty: false, dayNum, dateKey: currentKey, amt: totalSales });
    }
    return cells;
  }, [vault, date]);

  const generateLog = () => {
    const n = v => parseFloat(v) || 0;
    const { total_sales, total_que, real_sales, total_cnt, total_km, total_h, jikyu } = summary;
    const dayJa = ['日','月','火','水','木','金','土'][new Date(date).getDay()];
    const dateStr = date.replace(/-/g,'/');

    const last = sets[sets.length - 1] || EMPTY_SET();
    const d_total = n(last.d_cum); const u_total = n(last.u_cum); const r_total = n(last.r_cum); const m_total = n(last.m_cum);
    const d_cnt   = n(last.d_cnt_cum); const u_cnt   = n(last.u_cnt_cum); const r_cnt   = n(last.r_cnt_cum); const m_cnt   = n(last.m_cnt_cum);
    const d_que = n(last.d_que_cum); const u_que = n(last.u_que_cum); const r_que = n(last.r_que_cum); const m_que = n(last.m_que_cum);

    const hm = (h) => { const hh = Math.floor(h); const mm = Math.round((h - hh) * 60); return mm > 0 ? `${hh}時間${mm}分` : `${hh}時間`; };
    
    let log = `${dateStr} (${dayJa})\n📊 本日累計リザルト\n\n| 項目 | 内容 | 備考 |\n| :-- | --: | :-- |\n`;
    log += `| **天気** | ${weather} | ${total_que > 0 ? 'クエあり' : 'クエなし'} |\n`;
    log += `| **総売上** | **${(total_sales + total_que).toLocaleString()} 円** | |\n`;
    log += `| **実質売上** | **${real_sales.toLocaleString()} 円** | クエスト含まず |\n`;
    log += `| **クエ合計** | **${total_que.toLocaleString()} 円** | |\n`;
    log += `| **総完了件数** | **${total_cnt} 件** | (D:${d_cnt} / U:${u_cnt} / R:${r_cnt} / m:${m_cnt}) |\n`;
    log += `| **1件単価平均** | **${total_cnt > 0 ? Math.round((total_sales + total_que) / total_cnt) : 0} 円** | 総売上 ÷ 総件数 |\n`;
    log += `| **総走行距離** | **${total_km} km** | |\n`;
    log += `| **実稼働時間** | **${hm(total_h)}** | |\n`;
    log += `| **時給換算** | **${jikyu.toLocaleString()} 円** | 総売上 ÷ 実稼働時間 |\n\n📦 Platform別内訳\n\n`;
    log += `| PF | 件数 | 総額 | 実質売上 | クエ |\n| :--: | --: | --: | --: | --: |\n`;
    log += `| **出前館 (D)** | ${d_cnt} 件 | ${(d_total+d_que).toLocaleString()} 円 | ${d_total.toLocaleString()} 円 | ${d_que.toLocaleString()} 円 |\n`;
    log += `| **Uber Eats (U)** | ${u_cnt} 件 | ${(u_total+u_que).toLocaleString()} 円 | ${u_total.toLocaleString()} 円 | ${u_que.toLocaleString()} 円 |\n`;
    log += `| **RocketNow (R)** | ${r_cnt} 件 | ${(r_total+r_que).toLocaleString()} 円 | ${r_total.toLocaleString()} 円 | ${r_que.toLocaleString()} 円 |\n`;
    log += `| **menu (m)** | ${m_cnt} 件 | ${(m_total+m_que).toLocaleString()} 円 | ${m_total.toLocaleString()} 円 | ${m_que.toLocaleString()} 円 |\n\n🕒 各セット詳細\n\n`;

    calced.forEach((s, i) => {
      const sp = s.d_p + s.u_p + s.r_p + s.m_p; const sc = s.d_c + s.u_c + s.r_c + s.m_c;
      const pf_parts = []; if (s.d_c > 0) pf_parts.push(`D:${s.d_c}`); if (s.u_c > 0) pf_parts.push(`U:${s.u_c}`); if (s.r_c > 0) pf_parts.push(`R:${s.r_c}`); if (s.m_c > 0) pf_parts.push(`m:${s.m_c}`);
      log += `- **第${i+1}セット ${s.start || '--:--'} 〜 ${s.end || '--:--'}** ${s.dur ? `(${s.dur.h>0?s.dur.h+'h':''}${s.dur.m}m)` : ''}\n`;
      log += `  - **実績**：${sc}件 / ${sp.toLocaleString()}円${s.km_p > 0 ? ` / ${s.km_p}km` : ''} ${pf_parts.length>0 ? `(${pf_parts.join(' / ')})` : ''}\n`;
      if (s.memo) log += `  - **戦術**：${s.memo}\n`;
      log += '\n';
    });
    return log.trim();
  };

  const currentTotal = total_sales + total_que;
  const tankaReal = total_cnt > 0 ? Math.round(total_sales / total_cnt) : 0;
  const remain = goalAmt > 0 ? goalAmt - currentTotal : 0;
  const needCnt = (! (goalAmt > 0 && currentTotal >= goalAmt) && tankaReal > 0 && remain > 0) ? Math.ceil(remain / tankaReal) : 0;

  return (
    <div class="app-shell">
      {/* SIDEBAR (PC PANEL) */}
      <aside class="sidebar">
        <div class="brand">
          <div class="brand-mark">🛡️</div>
          <div>
            <div class="brand-title">VIBE ANALYTICS</div>
            <p style={{fontSize:'9px', color:'var(--muted)'}}>V9 ACCUMULATE MODEL</p>
          </div>
        </div>
        <nav class="nav-menu">
          <button class={`nav-item ${activeTab === 'dashboard' ? 'active' : ''}`} onClick={() => setActiveTab('dashboard')}>📊 ホーム</button>
          <button class={`nav-item ${activeTab === 'calendar' ? 'active' : ''}`} onClick={() => setActiveTab('calendar')}>📅 カレンダー</button>
          <button class={`nav-item ${activeTab === 'entries' ? 'active' : ''}`} onClick={() => setActiveTab('entries')}>📝 記録入力</button>
          <button class={`nav-item ${activeTab === 'settings' ? 'active' : ''}`} onClick={() => setActiveTab('settings')}>⚙️ 設定・データ</button>
        </nav>
      </aside>

      {/* MAIN LAYOUT CONTENT */}
      <div class="main-content">
        <header class="topbar">
          <div>
            <p>Target Date // {date.replace(/-/g,'/')}</p>
            <h1>🛡️ VIBE ANALYTICS V9</h1>
          </div>
        </header>

        {/* LIVE SUMMARY HEADER */}
        <div class="summary-bar">
          <div class="sum-row">
            <div class="sum-item"><div class="sum-label">総売上</div><div class="sum-val accent">{currentTotal.toLocaleString()}円</div></div>
            <div class="sum-item"><div class="sum-label">実質売上</div><div class="sum-val">{real_sales.toLocaleString()}円</div></div>
            <div class="sum-item"><div class="sum-label">クエ合計</div><div class="sum-val teal">{total_que.toLocaleString()}円</div></div>
            <div class="sum-item"><div class="sum-label">件数</div><div class="sum-val green">{total_cnt}件</div></div>
            <div class="sum-item"><div class="sum-label">実働時間</div><div class="sum-val">{total_h > 0 ? (() => { const hh = Math.floor(total_h); const mm = Math.round((total_h - hh) * 60); return mm > 0 ? hh+'h'+mm+'m' : hh+'h'; })() : '-'}</div></div>
          </div>
          <div class="sum-row">
            <div class="sum-item"><div class="sum-label">時給換算</div><div class="sum-val yellow">{total_h > 0 ? jikyu.toLocaleString() : '-'}円</div></div>
            <div class="sum-item"><div class="sum-label">単価(込)</div><div class="sum-val">{total_cnt > 0 ? Math.round(currentTotal / total_cnt).toLocaleString() : '-'}円</div></div>
            <div class="sum-item"><div class="sum-label">単価(抜)</div><div class="sum-val">{tankaReal > 0 ? tankaReal.toLocaleString() : '-'}円</div></div>
          </div>
        </div>

        {/* GOAL BAR */}
        <div class="goal-bar">
          <span class="goal-label">🎯 目標設定</span>
          <input class="goal-input" type="number" value={goalAmt || ''} onChange={e => updateDayField('goalAmt', Number(e.target.value))} placeholder="例: 20000" />
          <span class="goal-label">円</span>
          {goalAmt > 0 && (
            <>
              <span style={{color:'var(--border)'}}>|</span>
              {currentTotal >= goalAmt ? <span class="goal-stat done">✅ 目標達成！</span> : (
                <>
                  <span class="goal-stat remain">残り {remain.toLocaleString()}円</span>
                  <span style={{color:'var(--border)'}}>|</span>
                  <span class="goal-stat cnt">{needCnt > 0 ? `あと ${needCnt} 件` : '-'}</span>
                </>
              )}
            </>
          )}
        </div>

        {/* ── TAB CONTENT 1: DASHBOARD ── */}
        <div class={`view-container ${activeTab === 'dashboard' ? 'active' : ''}`}>
          <div class="section-title">本日の概要</div>
          <div class="card grid-3">
            <div><label>選択中営業日</label><input type="date" value={date} onChange={e => setDate(e.target.value)} style={{borderColor:'var(--teal)'}} /></div>
            <div><label>天気状況</label><select value={weather} onChange={e => updateDayField('weather', e.target.value)}>{WEATHERS.map(w => <option key={w}>{w}</option>)}</select></div>
            <div><label>総走行距離</label><div style={{padding:'11px 12px', background:'rgba(255,255,255,0.02)', border:'1.5px solid var(--border)', borderRadius:'var(--radius-sm)', fontSize:'14px', fontFamily:'var(--font-mono)'}}>{total_km} km</div></div>
          </div>

          <div class="section-title">本日累計のプラットフォーム内訳</div>
          {PLATFORMS.map(p => {
            const last = sets[sets.length - 1] || EMPTY_SET();
            const n = v => parseFloat(v) || 0;
            return (
              <div key={p.key} class="platform-block" style={{background: p.color+'07', borderColor: p.color+'30'}}>
                <div class="platform-title" style={{color: p.color}}>
                  <span>{p.label}</span>
                  <span class="diff-badge" style={{background: p.color+'15', color: p.color}}>{n(last[p.key+'_cum']).toLocaleString()} 円 / {n(last[p.key+'_cnt_cum'])} 件</span>
                </div>
              </div>
            );
          })}
          
          <button class="gen-btn" style={{marginTop:'10px'}} onClick={() => setActiveTab('entries')}>📝 記録の編集・セット追加を行う</button>
        </div>

        {/* ── TAB CONTENT 2: CALENDAR ── */}
        <div class={`view-container ${activeTab === 'calendar' ? 'active' : ''}`}>
          <div class="section-title">月間売上カレンダー</div>
          <div class="card" style={{padding:'10px'}}>
            <div class="cal-grid">
              {['日','月','火','水','木','金','土'].map(w => <div key={w} class="cal-head-cell">{w}</div>)}
              {calendarDays.map((c, idx) => c.empty ? <div key={idx} class="cal-day-cell empty" /> : (
                <div key={idx} class={`cal-day-cell ${date === c.dateKey ? 'selected' : ''}`} onClick={() => { setDate(c.dateKey); setActiveTab('dashboard'); }}>
                  <span class="cal-day-num current-month">{c.dayNum}</span>
                  {c.amt > 0 && <span class="cal-day-amt">¥{Math.round(c.amt/1000)}k</span>}
                </div>
              ))}
            </div>
          </div>
        </div>

        {/* ── TAB CONTENT 3: ENTRIES (CORE SET-BY-SET SYSTEM) ── */}
        <div class={`view-container ${activeTab === 'entries' ? 'active' : ''}`}>
          <div class="section-title">稼働セットごとの詳細入力 (4時起点自動保存)</div>
          
          {calced.map((s, i) => {
            const sp = s.d_p + s.u_p + s.r_p + s.m_p; const sq = s.d_qp + s.u_qp + s.r_qp + s.m_qp; const sc = s.d_c + s.u_c + s.r_c + s.m_c;
            return (
              <div key={i} class="set-card">
                <div class="set-header" onClick={() => toggleOpen(i)}>
                  <div class="set-title">
                    <span>SET {i+1}</span>
                    {s.start && !s.end && <span class="set-badge active">稼働中</span>}
                    {s.start && s.end && <span class="set-badge done">完了</span>}
                  </div>
                  <div style={{display:'flex', alignItems:'center', gap:'10px'}}>
                    {(sp > 0 || sc > 0) && <span class="set-summary">{sc}件 / {sp.toLocaleString()}円</span>}
                    <span class={`chevron ${s.open ? 'open' : ''}`}>▼</span>
                  </div>
                </div>

                {s.open && (
                  <div class="set-body">
                    <div class="time-row">
                      <div>
                        <label>開始時刻</label>
                        <div class="time-field">
                          <input type="time" value={sets[i].start} onChange={e => updateSet(i,'start',e.target.value)} />
                          <button class="stamp-btn" onClick={() => updateSet(i,'start',getNow())}>NOW</button>
                        </div>
                      </div>
                      <div>
                        <label>終了時刻</label>
                        <div class="time-field">
                          <input type="time" value={sets[i].end} onChange={e => updateSet(i,'end',e.target.value)} />
                          <button class="stamp-btn secondary" onClick={() => updateSet(i,'end',getNow())}>FIN</button>
                        </div>
                      </div>
                    </div>
                    {s.dur && <div class="time-duration">セット稼働時間: {s.dur.h > 0 ? `${s.dur.h}時間` : ''}{s.dur.m}分</div>}

                    {PLATFORMS.map(p => (
                      <div key={p.key} class="platform-block" style={{background: p.color+'05', borderColor: p.color+'20'}}>
                        <div class="platform-title" style={{color: p.color}}>
                          <span>{p.label}</span>
                          <span class="diff-badge">+{s[p.key+'_p'].toLocaleString()}円 / {s[p.key+'_c']}件 {s[p.key+'_qp']>0 ? `(クエ+${s[p.key+'_qp']})` : ''}</span>
                        </div>
                        <div class="pf-inputs">
                          <div><label>売上(累積)</label><input type="number" placeholder="0" value={sets[i][p.key+'_cum'] || ''} onChange={e => updateSet(i, p.key+'_cum', e.target.value)} /></div>
                          <div><label>件数(累積)</label><input type="number" placeholder="0" value={sets[i][p.key+'_cnt_cum'] || ''} onChange={e => updateSet(i, p.key+'_cnt_cum', e.target.value)} /></div>
                          <div><label>クエ累積</label><input type="number" placeholder="0" value={sets[i][p.key+'_que_cum'] || ''} onChange={e => updateSet(i, p.key+'_que_cum', e.target.value)} /></div>
                        </div>
                      </div>
                    ))}

                    <div class="grid-2" style={{marginTop:'12px'}}>
                      <div><label>走行距離累積 (km)</label><input type="number" placeholder="0" value={sets[i].km_cum} onChange={e => updateSet(i,'km_cum',e.target.value)} /></div>
                      <div><label>このセットの走行距離</label><div class="quest-total-display" style={{color: s.km_p > 0 ? 'var(--teal)' : 'var(--muted)'}}>{s.km_p > 0 ? `+${s.km_p} km` : '-'}</div></div>
                    </div>

                    <div style={{marginTop:'10px'}}><label>戦術メモ</label><textarea rows="2" placeholder="エリア状況・メモ記入" value={sets[i].memo} onChange={e => updateSet(i,'memo',e.target.value)} /></div>
                    {sets.length > 1 && <button class="del-btn" onClick={() => deleteSet(i)}>SET {i+1} を削除</button>}
                  </div>
                )}
              </div>
            );
          })}

          <button class="add-btn" onClick={addSet}>＋ 次のセットを追加</button>

          <div style={{marginTop:'24px'}}>
            <button class="gen-btn" onClick={() => setShowLog(!showLog)}>{showLog ? '入力に戻る' : '🚀 V5報告ログを生成'}</button>
            {showLog && (
              <div class="log-box">
                <pre>{generateLog()}</pre>
                <button class="copy-btn" onClick={() => { navigator.clipboard.writeText(generateLog()); alert('クリップボードにコピーしました！'); }}>ログをコピーする</button>
              </div>
            )}
          </div>
        </div>

        {/* ── TAB CONTENT 4: SETTINGS & HISTORIES ── */}
        <div class={`view-container ${activeTab === 'settings' ? 'active' : ''}`}>
          <div class="section-title">データコントロール</div>
          <div class="card">
            <button class="gen-btn" style={{background:'var(--blue)'}} onClick={startNewDay}>新しい営業日を開始する (4時起点判定)</button>
            <p style={{fontSize:'11px', color: 'var(--muted)', marginTop:'8px'}}>※現在の時刻が午前0:00〜3:59の場合、自動的に前日の日付ページを生成・リセットします。</p>
          </div>

          <div class="section-title">📜 蓄積された過去の稼働データ履歴</div>
          {historyList.length === 0 ? <div style={{textAlign:'center', padding:'20px', fontSize:'13px', color:'var(--muted)'}}>データがありません</div> : (
            historyList.map(h => (
              <div key={h.dateKey} class="history-card" style={{borderColor: date === h.dateKey ? 'var(--accent)' : ''}} onClick={() => { setDate(h.dateKey); setActiveTab('dashboard'); }}>
                <span class="history-date">{h.dateKey.replace(/-/g,'/')}</span>
                <span class="history-summary">{h.count} 件 / {h.total.toLocaleString()} 円</span>
              </div>
            ))
          )}
        </div>

        {/* BOTTOM NAV TABS BAR (MOBILE DISPLAY) */}
        <nav class="bottom-nav">
          <button class={`tab-btn ${activeTab === 'dashboard' ? 'active' : ''}`} onClick={() => setActiveTab('dashboard')}>
            <svg class="nav-icon" viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg><span>ホーム</span>
          </button>
          <button class={`tab-btn ${activeTab === 'calendar' ? 'active' : ''}`} onClick={() => setActiveTab('calendar')}>
            <svg class="nav-icon" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="18" y2="10"/></svg><span>カレンダー</span>
          </button>
          <button class={`tab-btn ${activeTab === 'entries' ? 'active' : ''}`} onClick={() => setActiveTab('entries')}>
            <svg class="nav-icon" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg><span>記録入力</span>
          </button>
          <button class={`tab-btn ${activeTab === 'settings' ? 'active' : ''}`} onClick={() => setActiveTab('settings')}>
            <svg class="nav-icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg><span>設定</span>
          </button>
        </nav>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
